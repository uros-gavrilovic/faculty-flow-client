<form [formGroup]="form"  class="grid gap-3 p-3">
	<div class="col-12 md:col-3">
		<p-iconfield class="w-full">
			<p-inputicon class="pi pi-search" />
			<input
				pInputText
				class="w-full"
				formControlName="name"
				placeholder="Reservation name">
		</p-iconfield>
	</div>

	<div class="col-12 md:col-3">
		<p-select
			class="w-full"
			formControlName="room"
			[options]="rooms()"
			optionLabel="name"
			optionValue="code"
			placeholder="Room"
			[filter]="true"
			filterBy="name"
			[showClear]="true"
			[appendTo]="'body'"
		/>
	</div>

	<div class="col-12 md:col-2">
		<p-select
			class="w-full"
			formControlName="status"
			[options]="statuses"
			placeholder="Status"
			[showClear]="true"
			[appendTo]="'body'"
		/>
	</div>

	<div class="col-12 md:col-2">
		<input
			pInputText
			class="w-full"
			formControlName="reservedBy"
			placeholder="Reserved by">
	</div>

	<div class="md:col-1">
		<p-button
			icon="pi pi-eraser"
			severity="secondary"
			(click)="onClear()"
		></p-button>
	</div>


</form>
