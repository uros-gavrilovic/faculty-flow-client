<form [formGroup]="form"  class="grid gap-3 p-3">
	<div class="col-12 md:col-3">
		<p-iconfield class="w-full">
			<p-inputicon class="pi pi-search" />
			<input
				pInputText
				class="w-full"
				formControlName="name"
				[placeholder]="'reservation.title' | translate">
		</p-iconfield>
	</div>

	<div class="col-12 md:col-3">
		<app-room-select formControlName="room" [placeholder]="'reservation.room' | translate" />
	</div>

	<div class="col-12 md:col-2">
		<p-select
			class="w-full"
			formControlName="status"
			[options]="statuses"
			[placeholder]="'reservation.status' | translate"
			[showClear]="true"
			[appendTo]="'body'">
			<ng-template #selectedItem let-status>{{ status | translateEnum: 'enum.reservation.status' }}</ng-template>
			<ng-template #item let-status>{{ status | translateEnum: 'enum.reservation.status' }}</ng-template>
		</p-select>
	</div>

	<div class="col-12 md:col-2">
		<input
			pInputText
			class="w-full"
			formControlName="reservedBy"
			[placeholder]="'reservation.reserved-by' | translate">
	</div>

	<div class="md:col-1">
		<p-button
			icon="pi pi-eraser"
			severity="secondary"
			(click)="onClear()"
		></p-button>
	</div>


</form>
