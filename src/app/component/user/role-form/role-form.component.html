<form [formGroup]="form">
	<h4 class="form-section-label" id="roles-label">
		<i class="pi pi-shield"></i>
		{{ 'user-management.role-and-permissions' | translate }}
	</h4>

	<div class="role-options" role="group" aria-labelledby="roles-label">
		@for (role of allRoles; track role) {
			<label
				class="role-option"
				[ngClass]="'role-' + getRoleSeverity(role)"
				[class.selected]="isSelected(role)"
			>
				<p-checkbox [inputId]="'role-' + role" [value]="role" formControlName="roles" />

				<span class="role-icon"><i [class]="roleIcons[role]"></i></span>

				<span class="role-text">
					<span class="role-title">{{ role | translateEnum: 'enum.user-role' }}</span>
					<span class="role-description">
						{{ 'user-management.role-description.' + role.toLowerCase() | translate }}
					</span>
				</span>
			</label>
		}
	</div>
</form>
