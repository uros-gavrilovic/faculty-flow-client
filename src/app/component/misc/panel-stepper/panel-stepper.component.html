<p-fieldset [toggleable]=toggleable>
	<ng-template #header>
		<div class="flex items-center gap-2 px-2">
			<p-avatar [icon]="icon" [styleClass]="iconStyleClass" shape="circle" />
			<span>{{ title | translate }}</span>
		</div>
	</ng-template>
	<div class="grid formgrid m-3">
		<ng-content />
	</div>
</p-fieldset>
