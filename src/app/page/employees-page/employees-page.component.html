<app-page-header
	[icon]="'pi pi-users'"
	[title]="'employee.panel-title'"
	[description]="'employee.panel-description'"
>
	<ng-container toolbar>
		<p-button
			label="{{ 'user-management.add-user' | translate }}"
			icon="pi pi-plus"
			styleClass="add-employee-btn"
			(onClick)="onAddEmployee()"
		/>
	</ng-container>

	<ng-container content>
		<app-user-table />
	</ng-container>
</app-page-header>
